<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor Admin - Reservasi Ruangan</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6 md:p-10">
    
    <div class="max-w-7xl mx-auto">
        
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-blue-900 mb-2">Dasbor Admin</h1>
                <p class="text-slate-500">Pusat Kendali Persetujuan Peminjaman Ruangan</p>
            </div>
            
            <a href="index.html" class="px-5 py-2 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-semibold rounded-lg shadow-sm transition-colors text-sm">
                Lihat Web Utama
            </a>
        </div>

        
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-blue-900 text-white text-sm">
                        <tr>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap">ID</th>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap">Peminjam</th>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap">NIM & Semester</th>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap">Lokasi</th>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap">Waktu</th>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap">Status</th>
                            <th class="py-3 px-4 font-semibold whitespace-nowrap text-center">Aksi</th>
                        </tr>
                    </thead>
                  
                    <tbody id="tabel-admin" class="text-sm text-slate-700 divide-y divide-slate-200">
                      
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="admin.js"></script>
</body>
</html>
